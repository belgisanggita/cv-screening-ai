<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV Screening — Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.11/purify.min.js"></script>
<style>
  :root {
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --ink: #20241F;
    --muted: #75786F;
    --border: #E3E1D8;
    --accent: #2F5D4F;
    --accent-soft: #E7EFEA;
    --bubble-hr: #20241F;
    --bubble-hr-text: #FAF9F6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    margin: 0 0 2px 0;
    font-weight: normal;
  }
  .settings-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .settings-row label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 3px;
  }
  .settings-row input {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    width: 100%;
  }
  .field { flex: 1; min-width: 120px; }
  .field.small { flex: 0 0 90px; min-width: 90px; }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .thread-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .row-hr { display: flex; justify-content: flex-end; }
  .bubble-hr {
    max-width: 420px;
    background: var(--bubble-hr);
    color: var(--bubble-hr-text);
    padding: 10px 16px;
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    font-size: 14px;
  }
  .attachment-note {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 5px;
  }
  .bubble-assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    max-width: 100%;
  }

  /* Markdown rendering styles */
  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    font-family: Georgia, "Times New Roman", serif;
    margin: 14px 0 8px 0;
    line-height: 1.3;
    color: var(--ink);
  }
  .markdown-body h1 { font-size: 18px; }
  .markdown-body h2 { font-size: 16px; }
  .markdown-body h3 { font-size: 15px; }
  .markdown-body h1:first-child,
  .markdown-body h2:first-child,
  .markdown-body h3:first-child { margin-top: 0; }

  .markdown-body p {
    margin: 8px 0;
    line-height: 1.55;
  }
  .markdown-body p:first-child { margin-top: 0; }
  .markdown-body p:last-child { margin-bottom: 0; }

  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 12px 0;
    font-size: 13px;
    overflow-x: auto;
    display: block;
  }
  .markdown-body th,
  .markdown-body td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: left;
    vertical-align: top;
  }
  .markdown-body th {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  .markdown-body tr:nth-child(even) td {
    background: var(--bg);
  }

  .markdown-body ul,
  .markdown-body ol {
    margin: 8px 0;
    padding-left: 22px;
  }
  .markdown-body li {
    margin: 4px 0;
    line-height: 1.5;
  }

  .markdown-body strong { color: var(--ink); font-weight: 600; }
  .markdown-body em { color: var(--muted); }

  .markdown-body hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }

  .markdown-body code {
    background: var(--bg);
    padding: 2px 5px;
    border-radius: 4px;
    font-size: 12px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .markdown-body pre {
    background: var(--bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  .markdown-body pre code {
    background: none;
    padding: 0;
  }

  .markdown-body a {
    color: var(--accent);
    text-decoration: none;
  }
  .markdown-body a:hover { text-decoration: underline; }

  .candidates-panel {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 16px;
  }
  .candidate {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .candidate:first-child { border-top: none; }
  .rank-badge {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .candidate-body { flex: 1; min-width: 0; }
  .candidate-title-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .candidate-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
  }
  .score {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .candidate-reasoning {
    font-size: 13px;
    color: var(--ink);
    margin-top: 4px;
    line-height: 1.4;
  }
  .candidate-file {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .candidate-file a {
    color: var(--accent);
    text-decoration: none;
  }
  .candidate-file a:hover {
    text-decoration: underline;
  }

  #composer {
    flex: none;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 24px;
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
  }
  .attach-chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    width: fit-content;
    margin-bottom: 8px;
  }
  .attach-chip.visible { display: flex; }
  .attach-chip button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    font-size: 14px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .icon-btn {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #fff;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-text {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>Penyaringan Kandidat</h1>
  <div class="settings-row">
    <div class="field">
      <label>Backend URL</label>
      <input id="baseUrl" value="http://localhost:8000/api/v1" />
    </div>
    <div class="field small">
      <label>Jumlah kandidat</label>
      <input id="topK" type="number" min="1" max="20" value="5" />
    </div>
  </div>
</header>

<div id="thread">
  <div class="thread-inner" id="threadInner"></div>
</div>

<div id="composer">
  <div class="composer-inner">
    <div class="attach-chip" id="attachChip">
      <span id="attachName"></span>
      <button id="removeAttach" title="Hapus lampiran">×</button>
    </div>
    <div class="composer-row">
      <button class="icon-btn" id="attachBtn" title="Lampirkan requirement (PDF)">📎</button>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none" />
      <input id="msgInput" placeholder="Tanya soal kandidat, mis: carikan kandidat cocok untuk posisi ini..." />
      <button class="icon-btn" id="sendBtn" title="Kirim">➤</button>
    </div>
    <div class="status-text" id="statusText"></div>
  </div>
</div>

<script>
const threadInner = document.getElementById('threadInner');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const attachChip = document.getElementById('attachChip');
const attachName = document.getElementById('attachName');
const removeAttach = document.getElementById('removeAttach');
const statusText = document.getElementById('statusText');

let pendingRequirementsFile = null; // File object (PDF), dikirim langsung sebagai bagian dari form /chat

function baseUrl() {
  return document.getElementById('baseUrl').value.replace(/\/$/, '');
}

function addHrBubble(text, attachmentName) {
  const row = document.createElement('div');
  row.className = 'row-hr';
  row.innerHTML = `
    <div>
      <div class="bubble-hr">${escapeHtml(text)}</div>
      ${attachmentName ? `<div class="attachment-note">📎 ${escapeHtml(attachmentName)}</div>` : ''}
    </div>
  `;
  threadInner.appendChild(row);
  scrollDown();
}

function renderMarkdown(text) {
  const raw = marked.parse(text || '');
  // Sanitize hasil parse markdown sebelum di-inject ke DOM
  return (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(raw) : raw;
}

function addAssistantBubble(answer, candidates) {
  const wrap = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'bubble-assistant markdown-body';
  bubble.innerHTML = renderMarkdown(answer);
  wrap.appendChild(bubble);

  if (candidates && candidates.length > 0) {
    const panel = document.createElement('div');
    panel.className = 'candidates-panel';
    candidates.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'candidate';

      const fileLine = c.file_url
        ? `<a href="${c.file_url}" target="_blank" rel="noopener">📄 ${escapeHtml(c.title || c.minio_file)}</a>`
        : `📄 ${escapeHtml(c.minio_file || '')}`;

      const reasoningLine = c.reasoning
        ? `<div class="candidate-reasoning">${escapeHtml(c.reasoning)}</div>`
        : '';

      row.innerHTML = `
        <div class="rank-badge">${i + 1}</div>
        <div class="candidate-body">
          <div class="candidate-title-row">
            <span class="candidate-name">${escapeHtml(c.title || c.document_id)}</span>
            <span class="score">${Math.round(c.score)}% match</span>
          </div>
          ${reasoningLine}
          <div class="candidate-file">${fileLine}</div>
        </div>
      `;
      panel.appendChild(row);
    });
    wrap.appendChild(panel);
  }

  threadInner.appendChild(wrap);
  scrollDown();
}

function addErrorBubble(text) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble-assistant';
  bubble.style.color = '#B3271A';
  bubble.textContent = text;
  threadInner.appendChild(bubble);
  scrollDown();
}

function scrollDown() {
  const thread = document.getElementById('thread');
  thread.scrollTop = thread.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;

  pendingRequirementsFile = file;
  attachName.textContent = file.name;
  attachChip.classList.add('visible');

  fileInput.value = '';
});

removeAttach.addEventListener('click', () => {
  pendingRequirementsFile = null;
  attachChip.classList.remove('visible');
});

async function sendMessage() {
  const message = msgInput.value.trim();
  if (!message) return;

  const topK = parseInt(document.getElementById('topK').value, 10) || 5;

  addHrBubble(message, pendingRequirementsFile ? pendingRequirementsFile.name : null);

  const formData = new FormData();
  formData.append('message', message);
  formData.append('top_k', topK);

  if (pendingRequirementsFile) {
    formData.append('requirements_file', pendingRequirementsFile);
  }

  msgInput.value = '';
  pendingRequirementsFile = null;
  attachChip.classList.remove('visible');
  sendBtn.disabled = true;
  statusText.textContent = 'Menganalisis kandidat...';

  try {
    // Jangan set Content-Type manual — browser otomatis set multipart/form-data + boundary yang benar
    const res = await fetch(`${baseUrl()}/chat`, {
      method: 'POST',
      body: formData,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(JSON.stringify(err.detail || `Error ${res.status}`));
    }

    const data = await res.json();
    addAssistantBubble(data.answer, data.candidates);
  } catch (e) {
    addErrorBubble(`Gagal mendapatkan jawaban: ${e.message}`);
  } finally {
    sendBtn.disabled = false;
    statusText.textContent = '';
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
