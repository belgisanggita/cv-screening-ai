<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV Screening — Chat</title>
<style>
  :root {
    --bg: #FAF9F6;
    --surface: #FFFFFF;
    --ink: #20241F;
    --muted: #75786F;
    --border: #E3E1D8;
    --accent: #2F5D4F;
    --accent-soft: #E7EFEA;
    --bubble-hr: #20241F;
    --bubble-hr-text: #FAF9F6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    margin: 0 0 2px 0;
    font-weight: normal;
  }
  .settings-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .settings-row label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 3px;
  }
  .settings-row input {
    font-size: 13px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    width: 100%;
  }
  .field { flex: 1; min-width: 120px; }
  .field.small { flex: 0 0 90px; min-width: 90px; }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  .thread-inner {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .row-hr { display: flex; justify-content: flex-end; }
  .bubble-hr {
    max-width: 420px;
    background: var(--bubble-hr);
    color: var(--bubble-hr-text);
    padding: 10px 16px;
    border-radius: 16px;
    border-bottom-right-radius: 4px;
    font-size: 14px;
  }
  .attachment-note {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 5px;
  }
  .bubble-assistant {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    max-width: 560px;
    white-space: pre-wrap;
  }
  .candidates-panel {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0 16px;
  }
  .candidate {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .candidate:first-child { border-top: none; }
  .rank-badge {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .candidate-body { flex: 1; min-width: 0; }
  .candidate-title-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    align-items: baseline;
  }
  .candidate-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
  }
  .score {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
  }
  .candidate-file {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  #composer {
    flex: none;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 24px;
  }
  .composer-inner {
    max-width: 700px;
    margin: 0 auto;
  }
  .attach-chip {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    width: fit-content;
    margin-bottom: 8px;
  }
  .attach-chip.visible { display: flex; }
  .attach-chip button {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .composer-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #msgInput {
    flex: 1;
    font-size: 14px;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .icon-btn {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #fff;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-text {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <h1>Penyaringan Kandidat</h1>
  <div class="settings-row">
    <div class="field">
      <label>Backend URL</label>
      <input id="baseUrl" value="http://localhost:8000/api/v1" />
    </div>
    <div class="field">
      <label>Client ID</label>
      <input id="clientId" value="design123" />
    </div>
    <div class="field">
      <label>Job Posting ID</label>
      <input id="jobId" value="job_123" />
    </div>
    <div class="field small">
      <label>Jumlah kandidat</label>
      <input id="topK" type="number" min="1" max="20" value="5" />
    </div>
  </div>
</header>

<div id="thread">
  <div class="thread-inner" id="threadInner"></div>
</div>

<div id="composer">
  <div class="composer-inner">
    <div class="attach-chip" id="attachChip">
      <span id="attachName"></span>
      <button id="removeAttach" title="Hapus lampiran">×</button>
    </div>
    <div class="composer-row">
      <button class="icon-btn" id="attachBtn" title="Lampirkan requirement (PDF)">📎</button>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none" />
      <input id="msgInput" placeholder="Tanya soal kandidat, mis: carikan kandidat cocok untuk posisi ini..." />
      <button class="icon-btn" id="sendBtn" title="Kirim">➤</button>
    </div>
    <div class="status-text" id="statusText"></div>
  </div>
</div>

<script>
const threadInner = document.getElementById('threadInner');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const attachChip = document.getElementById('attachChip');
const attachName = document.getElementById('attachName');
const removeAttach = document.getElementById('removeAttach');
const statusText = document.getElementById('statusText');

let pendingRequirementsFile = null; // { bucket_name, object_name, displayName }

function baseUrl() {
  return document.getElementById('baseUrl').value.replace(/\/$/, '');
}

function addHrBubble(text, attachmentName) {
  const row = document.createElement('div');
  row.className = 'row-hr';
  row.innerHTML = `
    <div>
      <div class="bubble-hr">${escapeHtml(text)}</div>
      ${attachmentName ? `<div class="attachment-note">📎 ${escapeHtml(attachmentName)}</div>` : ''}
    </div>
  `;
  threadInner.appendChild(row);
  scrollDown();
}

function addAssistantBubble(answer, candidates) {
  const wrap = document.createElement('div');

  const bubble = document.createElement('div');
  bubble.className = 'bubble-assistant';
  bubble.textContent = answer;
  wrap.appendChild(bubble);

  if (candidates && candidates.length > 0) {
    const panel = document.createElement('div');
    panel.className = 'candidates-panel';
    candidates.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'candidate';
      row.innerHTML = `
        <div class="rank-badge">${i + 1}</div>
        <div class="candidate-body">
          <div class="candidate-title-row">
            <span class="candidate-name">${escapeHtml(c.title || c.document_id)}</span>
            <span class="score">${(c.score * 100).toFixed(0)}% relevansi</span>
          </div>
          <div class="candidate-file">📄 ${escapeHtml(c.minio_file || '')}</div>
        </div>
      `;
      panel.appendChild(row);
    });
    wrap.appendChild(panel);
  }

  threadInner.appendChild(wrap);
  scrollDown();
}

function addErrorBubble(text) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble-assistant';
  bubble.style.color = '#B3271A';
  bubble.textContent = text;
  threadInner.appendChild(bubble);
  scrollDown();
}

function scrollDown() {
  const thread = document.getElementById('thread');
  thread.scrollTop = thread.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  statusText.textContent = 'Mengupload file...';
  try {
    const formData = new FormData();
    formData.append('file', file);

    const res = await fetch(`${baseUrl()}/upload`, {
      method: 'POST',
      body: formData,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Upload gagal (${res.status})`);
    }

    const data = await res.json();
    pendingRequirementsFile = {
      bucket_name: data.bucket_name,
      object_name: data.object_name,
      displayName: file.name,
    };

    attachName.textContent = file.name;
    attachChip.classList.add('visible');
    statusText.textContent = '';
  } catch (e) {
    statusText.textContent = `Gagal upload: ${e.message}`;
  }

  fileInput.value = '';
});

removeAttach.addEventListener('click', () => {
  pendingRequirementsFile = null;
  attachChip.classList.remove('visible');
});

async function sendMessage() {
  const message = msgInput.value.trim();
  if (!message) return;

  const clientId = document.getElementById('clientId').value.trim();
  const jobId = document.getElementById('jobId').value.trim();
  const topK = parseInt(document.getElementById('topK').value, 10) || 5;

  addHrBubble(message, pendingRequirementsFile ? pendingRequirementsFile.displayName : null);

  const body = {
    message,
    client_id: clientId,
    job_posting_id: jobId,
    top_k: topK,
  };

  if (pendingRequirementsFile) {
    body.requirements_file = {
      bucket_name: pendingRequirementsFile.bucket_name,
      object_name: pendingRequirementsFile.object_name,
    };
  }

  msgInput.value = '';
  pendingRequirementsFile = null;
  attachChip.classList.remove('visible');
  sendBtn.disabled = true;
  statusText.textContent = 'Menganalisis kandidat...';

  try {
    const res = await fetch(`${baseUrl()}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(JSON.stringify(err.detail || `Error ${res.status}`));
    }

    const data = await res.json();
    addAssistantBubble(data.answer, data.candidates);
  } catch (e) {
    addErrorBubble(`Gagal mendapatkan jawaban: ${e.message}`);
  } finally {
    sendBtn.disabled = false;
    statusText.textContent = '';
  }
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
